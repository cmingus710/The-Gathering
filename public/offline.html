<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121110" />
    <title>You're offline · The Gathering</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        background: #121110; color: #F7F4ED; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; }
      main { max-width: 26rem; text-align: center; background: #22201E; border-radius: 20px; padding: 32px 24px; }
      .badge { display: inline-flex; align-items: center; justify-content: center; width: 80px; height: 80px; border-radius: 50%; background: #F7F4ED; }
      img { width: 52px; height: auto; }
      h1 { font-size: 1.6rem; margin: 16px 0 8px; }
      p { color: #B3AC9F; line-height: 1.6; margin: 0 0 20px; }
      a { display: inline-block; min-height: 48px; line-height: 48px; padding: 0 24px; background: #F7F4ED; color: #1C1B19;
        border-radius: 999px; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 3px solid #AD8C53; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <span class="badge"><img src="/brand/gathering-icon.png" alt="" width="444" height="512" /></span>
      <h1>You're offline</h1>
      <p>The Gathering needs an internet connection. Please check your connection and try again.</p>
      <a href="/home">Try again</a>
    </main>
  </body>
</html>
