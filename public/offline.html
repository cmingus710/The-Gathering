<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F4ED" />
    <title>You're offline · The Gathering</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        background: #F7F4ED; color: #363430; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; }
      main { max-width: 26rem; text-align: center; background: #FFFFFF; border-radius: 16px; padding: 32px 24px; border: 1px solid #DDD5C6; }
      img { width: 72px; height: auto; }
      h1 { font-family: Georgia, serif; font-size: 1.6rem; margin: 16px 0 8px; }
      p { color: #716B61; line-height: 1.6; margin: 0 0 20px; }
      a { display: inline-block; min-height: 48px; line-height: 48px; padding: 0 20px; background: #80642F; color: #FFFFFF;
        border-radius: 10px; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 3px solid #80642F; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/gathering-icon.png" alt="" width="444" height="512" />
      <h1>You're offline</h1>
      <p>The Gathering needs an internet connection. Please check your connection and try again.</p>
      <a href="/home">Try again</a>
    </main>
  </body>
</html>
